<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Chatbot</title>
    <style>
        :root {
            /* Light Mode Colors */
            --bg-gradient-1: #667eea;
            --bg-gradient-2: #764ba2;
            --container-bg: #ffffff;
            --header-text: #ffffff;
            --text-primary: #333333;
            --text-secondary: #666666;
            --text-hint: #999999;
            --border-color: #e0e0e0;
            --message-bg: #f8f9fa;
            --bot-message-bg: #ffffff;
            --bot-message-border: #e0e0e0;
            --input-bg: #ffffff;
            --code-bg: #f4f4f4;
            --shadow-sm: rgba(0, 0, 0, 0.1);
            --shadow-md: rgba(0, 0, 0, 0.2);
            --shadow-lg: rgba(0, 0, 0, 0.3);
        }

        [data-theme="dark"] {
            /* Dark Mode Colors */
            --bg-gradient-1: #1a1a2e;
            --bg-gradient-2: #16213e;
            --container-bg: #0f1419;
            --header-text: #ffffff;
            --text-primary: #e4e6eb;
            --text-secondary: #b0b3b8;
            --text-hint: #8a8d91;
            --border-color: #2d3748;
            --message-bg: #1a202c;
            --bot-message-bg: #2d3748;
            --bot-message-border: #4a5568;
            --input-bg: #1a202c;
            --code-bg: #2d3748;
            --shadow-sm: rgba(0, 0, 0, 0.3);
            --shadow-md: rgba(0, 0, 0, 0.5);
            --shadow-lg: rgba(0, 0, 0, 0.7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background 0.4s ease;
        }

        .container {
            background: var(--container-bg);
            width: 100%;
            max-width: 800px;
            height: 90vh;
            max-height: 700px;
            border-radius: 20px;
            box-shadow: 0 20px 60px var(--shadow-lg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            backdrop-filter: blur(10px);
            transition: all 0.4s ease;
        }

        .header {
            background: linear-gradient(135deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 100%);
            color: var(--header-text);
            padding: 20px;
            text-align: center;
            position: relative;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .header-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .theme-toggle, .lang-toggle {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            color: white;
        }

        .theme-toggle:hover, .lang-toggle:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        .theme-toggle:hover {
            transform: rotate(15deg) scale(1.1);
        }

        .theme-toggle:active, .lang-toggle:active {
            transform: scale(0.95);
        }

        /* Language Dropdown */
        .lang-dropdown {
            position: relative;
        }

        .lang-menu {
            position: absolute;
            top: 55px;
            right: 0;
            background: var(--container-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 8px;
            min-width: 180px;
            display: none;
            z-index: 1000;
            box-shadow: 0 8px 24px var(--shadow-md);
            animation: slideDown 0.2s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .lang-menu.active {
            display: block;
        }

        .lang-option {
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s ease;
            color: var(--text-primary);
            font-size: 14px;
        }

        .lang-option:hover {
            background: var(--message-bg);
        }

        .lang-option.active {
            background: linear-gradient(135deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 100%);
            color: white;
        }

        .lang-flag {
            font-size: 20px;
        }

        .lang-name {
            flex: 1;
        }

        .progress-container {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            height: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-bar {
            height: 100%;
            background: #4CAF50;
            width: 0%;
            transition: width 0.5s ease;
        }

        .status {
            font-size: 14px;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: var(--message-bg);
            transition: background 0.4s ease;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 18px;
            word-wrap: break-word;
            transition: all 0.3s ease;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 100%);
            color: white;
            box-shadow: 0 4px 15px var(--shadow-sm);
        }

        .message.bot .message-content {
            background: var(--bot-message-bg);
            color: var(--text-primary);
            border: 1px solid var(--bot-message-border);
            box-shadow: 0 2px 8px var(--shadow-sm);
        }

        .typing {
            display: none;
            padding: 10px;
            color: var(--text-secondary);
            font-style: italic;
            transition: color 0.4s ease;
        }

        .typing.active {
            display: block;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.6;
            }
            50% {
                opacity: 1;
            }
        }

        .input-area {
            padding: 20px;
            background: var(--input-bg);
            border-top: 1px solid var(--border-color);
            transition: all 0.4s ease;
        }

        .input-hint {
            font-size: 12px;
            color: var(--text-hint);
            margin-bottom: 10px;
            text-align: center;
            transition: color 0.4s ease;
        }

        .input-container {
            display: flex;
            gap: 10px;
        }

        #messageInput {
            flex: 1;
            padding: 12px 18px;
            border: 2px solid var(--border-color);
            border-radius: 25px;
            font-size: 15px;
            outline: none;
            background: var(--input-bg);
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        #messageInput:focus {
            border-color: var(--bg-gradient-1);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        #sendButton {
            padding: 12px 25px;
            background: linear-gradient(135deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--shadow-sm);
        }

        #sendButton:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--shadow-md);
        }

        #sendButton:active {
            transform: translateY(0);
        }

        #sendButton:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        pre {
            background: var(--code-bg);
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 10px 0;
            border: 1px solid var(--border-color);
            transition: all 0.4s ease;
        }

        code {
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: var(--text-primary);
        }

        /* Scrollbar Styling */
        .messages::-webkit-scrollbar {
            width: 8px;
        }

        .messages::-webkit-scrollbar-track {
            background: var(--message-bg);
        }

        .messages::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        .messages::-webkit-scrollbar-thumb:hover {
            background: var(--text-hint);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-controls">
                <div class="lang-dropdown">
                    <button class="lang-toggle" id="langToggle" title="Change language">
                        <span id="langIcon">🌐</span>
                    </button>
                    <div class="lang-menu" id="langMenu">
                        <div class="lang-option" data-lang="en">
                            <span class="lang-flag">🇬🇧</span>
                            <span class="lang-name">English</span>
                        </div>
                        <div class="lang-option" data-lang="tr">
                            <span class="lang-flag">🇹🇷</span>
                            <span class="lang-name">Türkçe</span>
                        </div>
                        <div class="lang-option" data-lang="es">
                            <span class="lang-flag">🇪🇸</span>
                            <span class="lang-name">Español</span>
                        </div>
                        <div class="lang-option" data-lang="fr">
                            <span class="lang-flag">🇫🇷</span>
                            <span class="lang-name">Français</span>
                        </div>
                    </div>
                </div>
                <button class="theme-toggle" id="themeToggle" title="Toggle theme">
                    <span id="themeIcon">🌙</span>
                </button>
            </div>
            <h1 data-i18n="title">🔐 Crypto Chatbot</h1>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="status" id="status"><span data-i18n="status_message">Message</span> 0/36</div>
        </div>

        <div class="messages" id="messages">
            <div class="message bot">
                <div class="message-content" data-i18n="welcome_message">
                    Welcome! Chat with me naturally. I'll help you discover something special after 36 messages.
                </div>
            </div>
        </div>

        <div class="typing" id="typing"><span data-i18n="bot_typing">Bot is typing...</span></div>

        <div class="input-area">
            <div class="input-hint" id="hint"><span data-i18n="hint_message">Chat naturally to progress through the sequence...</span></div>
            <div class="input-container">
                <input type="text" id="messageInput" data-i18n-placeholder="input_placeholder" placeholder="Type your message..." maxlength="500">
                <button id="sendButton" data-i18n="send_button">Send</button>
            </div>
        </div>
    </div>

    <script>
        let sessionId = localStorage.getItem('chatbot_session_id');
        let messageCount = 0;
        let currentLang = localStorage.getItem('chatbot_language') || 'en';

        // Translations
        const translations = {
            en: {
                title: '🔐 Crypto Chatbot',
                status_message: 'Message',
                welcome_message: 'Welcome! Chat with me naturally. I\'ll help you discover something special after 36 messages.',
                bot_typing: 'Bot is typing...',
                hint_message: 'Chat naturally to progress through the sequence...',
                input_placeholder: 'Type your message...',
                send_button: 'Send',
                hint_remaining: 'Only {n} messages remaining...',
                hint_complete: 'Sequence complete! Type "show code" to receive your Python code.',
                error_init: 'Error initializing chat. Please refresh the page.',
                error_network: 'Network error. Please try again.',
                error_prefix: 'Error: '
            },
            tr: {
                title: '🔐 Kripto Chatbot',
                status_message: 'Mesaj',
                welcome_message: 'Hoş geldiniz! Benimle doğal bir şekilde sohbet edin. 36 mesajdan sonra özel bir şey keşfetmenize yardımcı olacağım.',
                bot_typing: 'Bot yazıyor...',
                hint_message: 'Sıralamayı ilerletmek için doğal bir şekilde sohbet edin...',
                input_placeholder: 'Mesajınızı yazın...',
                send_button: 'Gönder',
                hint_remaining: 'Sadece {n} mesaj kaldı...',
                hint_complete: 'Sıralama tamamlandı! Python kodunuzu almak için "show code" yazın.',
                error_init: 'Sohbet başlatılırken hata oluştu. Lütfen sayfayı yenileyin.',
                error_network: 'Ağ hatası. Lütfen tekrar deneyin.',
                error_prefix: 'Hata: '
            },
            es: {
                title: '🔐 Chatbot Cripto',
                status_message: 'Mensaje',
                welcome_message: '¡Bienvenido! Chatea conmigo de forma natural. Te ayudaré a descubrir algo especial después de 36 mensajes.',
                bot_typing: 'El bot está escribiendo...',
                hint_message: 'Chatea naturalmente para progresar en la secuencia...',
                input_placeholder: 'Escribe tu mensaje...',
                send_button: 'Enviar',
                hint_remaining: 'Solo {n} mensajes restantes...',
                hint_complete: '¡Secuencia completa! Escribe "show code" para recibir tu código Python.',
                error_init: 'Error al inicializar el chat. Por favor, recarga la página.',
                error_network: 'Error de red. Por favor, inténtalo de nuevo.',
                error_prefix: 'Error: '
            },
            fr: {
                title: '🔐 Chatbot Crypto',
                status_message: 'Message',
                welcome_message: 'Bienvenue ! Discutez avec moi naturellement. Je vous aiderai à découvrir quelque chose de spécial après 36 messages.',
                bot_typing: 'Le bot écrit...',
                hint_message: 'Discutez naturellement pour progresser dans la séquence...',
                input_placeholder: 'Tapez votre message...',
                send_button: 'Envoyer',
                hint_remaining: 'Seulement {n} messages restants...',
                hint_complete: 'Séquence complète ! Tapez "show code" pour recevoir votre code Python.',
                error_init: 'Erreur lors de l\'initialisation du chat. Veuillez actualiser la page.',
                error_network: 'Erreur réseau. Veuillez réessayer.',
                error_prefix: 'Erreur : '
            }
        };

        // Language Management
        function initLanguage() {
            updateLanguage(currentLang);
            updateLangMenuSelection();
        }

        function updateLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('chatbot_language', lang);

            // Update all elements with data-i18n
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    element.textContent = translations[lang][key];
                }
            });

            // Update placeholders
            document.querySelectorAll('[data-i18n-placeholder]').forEach(element => {
                const key = element.getAttribute('data-i18n-placeholder');
                if (translations[lang] && translations[lang][key]) {
                    element.placeholder = translations[lang][key];
                }
            });

            // Update status message
            updateStatusMessage();

            // Update hint if needed
            const hintElement = document.getElementById('hint');
            if (hintElement && hintElement.dataset.remaining !== undefined) {
                updateHintMessage(parseInt(hintElement.dataset.remaining));
            }

            // Update HTML lang attribute
            document.documentElement.lang = lang;
        }

        function updateStatusMessage() {
            const statusText = translations[currentLang].status_message;
            document.getElementById('status').innerHTML = `${statusText} ${messageCount}/36`;
        }

        function updateHintMessage(remaining) {
            const hintElement = document.getElementById('hint');
            hintElement.dataset.remaining = remaining;

            if (remaining === 0) {
                hintElement.innerHTML = `<span>${translations[currentLang].hint_complete}</span>`;
                hintElement.style.color = '#4CAF50';
                hintElement.style.fontWeight = 'bold';
            } else if (remaining <= 5) {
                const message = translations[currentLang].hint_remaining.replace('{n}', remaining);
                hintElement.innerHTML = `<span>${message}</span>`;
                hintElement.style.color = '#FF9800';
            } else {
                hintElement.innerHTML = `<span>${translations[currentLang].hint_message}</span>`;
                hintElement.style.color = '';
                hintElement.style.fontWeight = '';
            }
        }

        function toggleLangMenu() {
            const menu = document.getElementById('langMenu');
            menu.classList.toggle('active');
        }

        function selectLanguage(lang) {
            updateLanguage(lang);
            updateLangMenuSelection();
            document.getElementById('langMenu').classList.remove('active');
        }

        function updateLangMenuSelection() {
            document.querySelectorAll('.lang-option').forEach(option => {
                if (option.dataset.lang === currentLang) {
                    option.classList.add('active');
                } else {
                    option.classList.remove('active');
                }
            });
        }

        // Theme Management
        function initTheme() {
            const savedTheme = localStorage.getItem('chatbot_theme') || 'light';
            const themeIcon = document.getElementById('themeIcon');

            if (savedTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeIcon.textContent = '☀️';
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                themeIcon.textContent = '🌙';
            }
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            const themeIcon = document.getElementById('themeIcon');

            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('chatbot_theme', newTheme);

            themeIcon.textContent = newTheme === 'dark' ? '☀️' : '🌙';
        }

        // Initialize
        async function init() {
            if (!sessionId) {
                try {
                    const response = await fetch('/api/session/new', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' }
                    });
                    const data = await response.json();
                    sessionId = data.session_id;
                    localStorage.setItem('chatbot_session_id', sessionId);
                    console.log('New session created:', sessionId);
                } catch (error) {
                    console.error('Init error:', error);
                    addMessage('bot', translations[currentLang].error_init);
                }
            }
        }

        // Send message
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (!message || !sessionId) return;

            // Disable input
            input.disabled = true;
            document.getElementById('sendButton').disabled = true;

            // Add user message
            addMessage('user', message);
            input.value = '';

            // Show typing
            showTyping();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: message,
                        session_id: sessionId
                    })
                });

                const data = await response.json();
                hideTyping();

                if (response.ok) {
                    // Check for code
                    if (data.response.includes('```python')) {
                        addCodeMessage(data.response);
                    } else {
                        addMessage('bot', data.response);
                    }

                    // Update progress
                    if (data.metadata) {
                        messageCount = data.metadata.message_count;
                        updateProgress(messageCount);
                        updateHint(data.metadata.remaining);
                    }
                } else {
                    addMessage('bot', translations[currentLang].error_prefix + (data.error || 'Unknown error'));
                }
            } catch (error) {
                hideTyping();
                addMessage('bot', translations[currentLang].error_network);
                console.error('Send error:', error);
            } finally {
                // Re-enable input
                input.disabled = false;
                document.getElementById('sendButton').disabled = false;
                input.focus();
            }
        }

        // Add message
        function addMessage(type, text) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = text;

            messageDiv.appendChild(contentDiv);
            messagesDiv.appendChild(messageDiv);
            scrollToBottom();
        }

        // Add code message
        function addCodeMessage(text) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message bot';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';

            // Parse code blocks
            const codeBlockRegex = /```python\n([\s\S]*?)```/g;
            let lastIndex = 0;
            let match;

            while ((match = codeBlockRegex.exec(text)) !== null) {
                if (match.index > lastIndex) {
                    const textBefore = text.substring(lastIndex, match.index);
                    contentDiv.appendChild(document.createTextNode(textBefore));
                }

                const pre = document.createElement('pre');
                const code = document.createElement('code');
                code.textContent = match[1].trim();
                pre.appendChild(code);
                contentDiv.appendChild(pre);

                lastIndex = codeBlockRegex.lastIndex;
            }

            if (lastIndex < text.length) {
                const textAfter = text.substring(lastIndex);
                contentDiv.appendChild(document.createTextNode(textAfter));
            }

            messageDiv.appendChild(contentDiv);
            messagesDiv.appendChild(messageDiv);
            scrollToBottom();
        }

        // Update progress
        function updateProgress(count) {
            messageCount = count;
            const percentage = (count / 36) * 100;
            document.getElementById('progressBar').style.width = `${percentage}%`;
            updateStatusMessage();
        }

        // Update hint
        function updateHint(remaining) {
            updateHintMessage(remaining);
        }

        // Show/hide typing
        function showTyping() {
            document.getElementById('typing').classList.add('active');
        }

        function hideTyping() {
            document.getElementById('typing').classList.remove('active');
        }

        // Scroll to bottom
        function scrollToBottom() {
            const messagesDiv = document.getElementById('messages');
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // Event listeners
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize language first
            initLanguage();

            // Initialize theme
            initTheme();

            // Initialize chat session
            init();

            // Language toggle button
            document.getElementById('langToggle').addEventListener('click', toggleLangMenu);

            // Language options
            document.querySelectorAll('.lang-option').forEach(option => {
                option.addEventListener('click', () => {
                    selectLanguage(option.dataset.lang);
                });
            });

            // Close language menu when clicking outside
            document.addEventListener('click', (e) => {
                const langDropdown = document.querySelector('.lang-dropdown');
                if (!langDropdown.contains(e.target)) {
                    document.getElementById('langMenu').classList.remove('active');
                }
            });

            // Theme toggle button
            document.getElementById('themeToggle').addEventListener('click', toggleTheme);

            // Send button
            document.getElementById('sendButton').addEventListener('click', sendMessage);

            // Enter key to send
            document.getElementById('messageInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            // Focus input
            document.getElementById('messageInput').focus();
        });
    </script>
</body>
</html>
