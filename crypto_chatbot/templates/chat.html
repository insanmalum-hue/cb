<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 800px;
            height: 90vh;
            max-height: 700px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .progress-container {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            height: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-bar {
            height: 100%;
            background: #4CAF50;
            width: 0%;
            transition: width 0.5s ease;
        }

        .status {
            font-size: 14px;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 18px;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .message.bot .message-content {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
        }

        .typing {
            display: none;
            padding: 10px;
            color: #666;
            font-style: italic;
        }

        .typing.active {
            display: block;
        }

        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
        }

        .input-hint {
            font-size: 12px;
            color: #999;
            margin-bottom: 10px;
            text-align: center;
        }

        .input-container {
            display: flex;
            gap: 10px;
        }

        #messageInput {
            flex: 1;
            padding: 12px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 15px;
            outline: none;
        }

        #messageInput:focus {
            border-color: #667eea;
        }

        #sendButton {
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        #sendButton:hover {
            opacity: 0.9;
        }

        #sendButton:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        pre {
            background: #f4f4f4;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 10px 0;
        }

        code {
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔐 Crypto Chatbot</h1>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="status" id="status">Message 0/36</div>
        </div>

        <div class="messages" id="messages">
            <div class="message bot">
                <div class="message-content">
                    Welcome! Chat with me naturally. I'll help you discover something special after 36 messages.
                </div>
            </div>
        </div>

        <div class="typing" id="typing">Bot is typing...</div>

        <div class="input-area">
            <div class="input-hint" id="hint">Chat naturally to progress through the sequence...</div>
            <div class="input-container">
                <input type="text" id="messageInput" placeholder="Type your message..." maxlength="500">
                <button id="sendButton">Send</button>
            </div>
        </div>
    </div>

    <script>
        let sessionId = localStorage.getItem('chatbot_session_id');
        let messageCount = 0;

        // Initialize
        async function init() {
            if (!sessionId) {
                try {
                    const response = await fetch('/api/session/new', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' }
                    });
                    const data = await response.json();
                    sessionId = data.session_id;
                    localStorage.setItem('chatbot_session_id', sessionId);
                    console.log('New session created:', sessionId);
                } catch (error) {
                    console.error('Init error:', error);
                    addMessage('bot', 'Error initializing chat. Please refresh the page.');
                }
            }
        }

        // Send message
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (!message || !sessionId) return;

            // Disable input
            input.disabled = true;
            document.getElementById('sendButton').disabled = true;

            // Add user message
            addMessage('user', message);
            input.value = '';

            // Show typing
            showTyping();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: message,
                        session_id: sessionId
                    })
                });

                const data = await response.json();
                hideTyping();

                if (response.ok) {
                    // Check for code
                    if (data.response.includes('```python')) {
                        addCodeMessage(data.response);
                    } else {
                        addMessage('bot', data.response);
                    }

                    // Update progress
                    if (data.metadata) {
                        messageCount = data.metadata.message_count;
                        updateProgress(messageCount);
                        updateHint(data.metadata.remaining);
                    }
                } else {
                    addMessage('bot', 'Error: ' + (data.error || 'Unknown error'));
                }
            } catch (error) {
                hideTyping();
                addMessage('bot', 'Network error. Please try again.');
                console.error('Send error:', error);
            } finally {
                // Re-enable input
                input.disabled = false;
                document.getElementById('sendButton').disabled = false;
                input.focus();
            }
        }

        // Add message
        function addMessage(type, text) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = text;

            messageDiv.appendChild(contentDiv);
            messagesDiv.appendChild(messageDiv);
            scrollToBottom();
        }

        // Add code message
        function addCodeMessage(text) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message bot';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';

            // Parse code blocks
            const codeBlockRegex = /```python\n([\s\S]*?)```/g;
            let lastIndex = 0;
            let match;

            while ((match = codeBlockRegex.exec(text)) !== null) {
                if (match.index > lastIndex) {
                    const textBefore = text.substring(lastIndex, match.index);
                    contentDiv.appendChild(document.createTextNode(textBefore));
                }

                const pre = document.createElement('pre');
                const code = document.createElement('code');
                code.textContent = match[1].trim();
                pre.appendChild(code);
                contentDiv.appendChild(pre);

                lastIndex = codeBlockRegex.lastIndex;
            }

            if (lastIndex < text.length) {
                const textAfter = text.substring(lastIndex);
                contentDiv.appendChild(document.createTextNode(textAfter));
            }

            messageDiv.appendChild(contentDiv);
            messagesDiv.appendChild(messageDiv);
            scrollToBottom();
        }

        // Update progress
        function updateProgress(count) {
            const percentage = (count / 36) * 100;
            document.getElementById('progressBar').style.width = `${percentage}%`;
            document.getElementById('status').textContent = `Message ${count}/36`;
        }

        // Update hint
        function updateHint(remaining) {
            const hintElement = document.getElementById('hint');
            if (remaining === 0) {
                hintElement.textContent = 'Sequence complete! Type "show code" to receive your Python code.';
                hintElement.style.color = '#4CAF50';
                hintElement.style.fontWeight = 'bold';
            } else if (remaining <= 5) {
                hintElement.textContent = `Only ${remaining} messages remaining...`;
                hintElement.style.color = '#FF9800';
            }
        }

        // Show/hide typing
        function showTyping() {
            document.getElementById('typing').classList.add('active');
        }

        function hideTyping() {
            document.getElementById('typing').classList.remove('active');
        }

        // Scroll to bottom
        function scrollToBottom() {
            const messagesDiv = document.getElementById('messages');
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // Event listeners
        document.addEventListener('DOMContentLoaded', () => {
            init();

            document.getElementById('sendButton').addEventListener('click', sendMessage);

            document.getElementById('messageInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            document.getElementById('messageInput').focus();
        });
    </script>
</body>
</html>
